spring.application.name=course-service
server.port=8082

# Same phone book as everyone else
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Wrap Feign calls in a circuit breaker so the fallback works
spring.cloud.openfeign.circuitbreaker.enabled=true

# show health details + expose health, info and metrics endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# record 100% of requests (lab setting; production uses a small %)
management.tracing.sampling.probability=1.0
# where to send the traces
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest